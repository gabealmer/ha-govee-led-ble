schema_version: 1
purpose: Observed visual behaviour from calibrated camera captures. This evidence does not describe BLE wire semantics.
primitive_values:
- static
- global_pulse
- abrupt_global_transition
- directional_sweep
- local_variation
- unknown
primitive_definitions:
  static: No measured temporal variation above the camera-noise threshold.
  global_pulse: Periodic, spatially synchronous brightness variation.
  abrupt_global_transition: Short, high-magnitude aggregate lane-colour transition. It does not claim a strobe or flash effect.
  directional_sweep: Coherent adjacent-lane phase progression.
  local_variation: Spatially non-uniform variation without coherent direction.
  unknown: The strongest measured candidate did not meet the primitive evidence threshold.
review_schema_version: 1
review_states:
  pending_human_review: Automated classification only.  Never usable for a motion preview.
  reviewed: A reviewer inspected the recorded evidence listed under review.inspected and accepted the primitive for preview use.
preview_primitives:
- static
- global_pulse
- directional_sweep
minimum_review_confidence: 0.85
review:
  id: 20260812-h617a-preview-curation
  basis: recorded_evidence
  statement: Review means a reviewer inspected the recorded artefacts for a candidate and judged what they support.  Nobody re-observed the strip while reviewing, so nothing here is
    a direct human observation of a device.
  identity_basis: Immutable sku, scene_id and effect_id from the capture manifest.  Scene names were not used as evidence.
  inspected:
  - The per-scene contact sheet, which samples twelve times across the capture.
  - The per-segment RGB time series and the derived features in the analysis results.
  - The lane calibration diagnostic, which shows the traced ridge and the fifteen numbered lanes on the strip.
  diagnostic:
    file: diagnostics/calibration-lanes.png
    sha256: aef162e9301f8089e99c087d644d598ac5896e686e1f0005812cf99234cbe7aa
  excluded_primitives:
    abrupt_global_transition: The measurement is an aggregate lane-colour change rate.  It fixes neither the spatial pattern nor the colour sequence, so a preview would have to invent
      both.  Contact sheets across this class show multi-band, multi-colour behaviour that one aggregate label does not capture.
    local_variation: The definition withholds direction and geometry by construction, so the measurement cannot constrain a rendered animation.
    unknown: No candidate reached the evidence threshold, so there is nothing to render.
  corpus_limitations:
  - Every capture runs for about 13.4 s at roughly 15 frames per second, so slow behaviour and sub-frame behaviour are both outside the evidence.
  - Colour is uncalibrated camera sRGB.  The corpus white capture saturates its red channel, so there is no trustworthy white point and recorded hue and saturation are indicative only.
  - Per-segment brightness carries viewing-angle and exposure falloff.  The unclipped green channel of the corpus white capture varies by about a quarter along the strip and lane 7 sits
    on a corner.
  - Scenes that carry a parameter were applied with the committed catalogue default, so any timing claim holds for that parameterisation only.
  - 'One capture classified as global_pulse was rejected on review: its aggregate brightness period tracks a stepped orange to yellow to green colour progression that does not repeat
    within the window, so a synchronous brightness pulse would misdescribe it.'
