# Machine-readable H617A/H6199 protocol and capability atlas.
#
# One row per (model, capability). This is a cross-reference over evidence that already
# exists elsewhere (Kaitai schemas, fixtures in spec/*.kst, generated_protocol/*.py, and
# handwritten runtime modules) — it does not restate wire structure, and it is not prose
# documentation. capability_atlas_lint.py enforces required fields, enum membership, row
# uniqueness, and that every reference resolves to something real.
#
# Field meaning per row:
#   evidence_status   Confidence in the WIRE STRUCTURE claim, independent of whether the
#                      integration uses it. See evidence_status_values below.
#   kaitai_schema      "file.ksy::type_name" entries the row rests on, or [] if unmodelled.
#   evidence_refs      spec/*.kst ids this row's evidence_status rests on, or a "capture:"
#                      label for evidence known only from an uncommitted/historical capture
#                      (see capture-privacy note below). [] if evidence_status is absent.
#   generated_module   path to the committed generated_protocol/*.py module this reads or
#                      writes through, or null if no generated module is involved.
#   runtime            {encode, decode, readback} wiring_status for handwritten runtime
#                      code (protocol.py / coordinator*.py / h6199_controls.py / light.py),
#                      independent of evidence_status: a domain can be fully confirmed on
#                      the wire and still unwired at runtime, or vice versa.
#   ha_surface         What a user can currently see/do in Home Assistant. "none" if unwired.
#   persistence_need   How the integration keeps this value across HA/device restarts.
#   preview_level      How faithfully an offline/simulated preview can represent this
#                      capability. See preview_level_values below.
#   known_gaps         Open, factual gaps. Empty list only when there is genuinely nothing
#                      left to flag.
#
# Capture-privacy note: real capture files and BLE addresses are never committed (see
# spec/*.kst provenance.source, which is always a bare session filename). evidence_refs
# follows the same rule: "capture:<label>" is a descriptive label only, never an address
# or a committed file.
schema_version: 1

evidence_status_values:
  - confirmed # multiple independent fixtures, or one fixture plus an aggregate, agree
  - corroborated # fixture evidence exists but only from one side (e.g. write, not readback)
  - inferred # no committed fixture; derived from adjacent evidence or model symmetry
  - raw_attributed # only ever observed live/historically; never captured in a committed fixture
  - absent # no schema, no fixture, no runtime code

preview_level_values:
  - deterministic # exact preview computable from protocol fields alone
  - modelled # accurate preview via a documented, evidenced algorithm
  - structural # fields/shape known, but the rendering algorithm is not
  - opaque # not reliably decoded; no meaningful preview possible today
  - live # requires live hardware/signal; no offline preview possible in principle

persistence_need_values:
  - device_readback # device is the source of truth; verified via query/readback, no restore
  - deployment_intent # operation history records what was sent when exact device readback is unavailable
  - restore_required # optimistic write only; HA must restore the value on restart
  - none # nothing to persist (stateless query, telemetry, or unwired)

wiring_status_values:
  - wired # a handwritten runtime function performs this operation
  - decode_only # a generated parser exists and is exercised, but only by kst_runner.py,
    # never called from handwritten runtime code
  - encode_only # a handwritten builder exists but nothing decodes the corresponding reply
  - tool_only # exercised by a standalone dev tool (tools/ble/*), deliberately not shipped
    # into the runtime code path
  - none # no runtime code performs this operation

# Evidence-pipeline caveats that apply across many rows rather than to one. Referenced
# from individual rows' known_gaps by id rather than restated per row.
pipeline_known_issues:
  - id: source_index_provenance_not_reproducible
    summary: >-
      spec/*.kst provenance.source_index records "this was frame N of session <source>",
      but the session captures themselves are never committed (capture-privacy
      convention), so source_index cannot be independently replayed or re-derived from
      anything in this repository — it is trusted metadata, not a reproducible check.
      Reproducibility also varies by provenance.kind: capture_frame fixtures carry
      source_sha256 plus source_index; catalogue fixtures (e.g. official scene/effect
      catalogue dumps) and retained_fixture fixtures (pre-provenance corpus, kept because
      historically validated) carry neither, so a nonzero fraction of the corpus was
      never reproducible even in principle, not only in practice.
    status: open
    affects: [evidence_pipeline]

  - id: preview_fidelity_ceiling
    summary: >-
      Verified previewability finding covering both models' animatable capabilities.
      Exact, deterministic static preview is achievable for static colour/brightness
      and diy_type03's background plus explicit 15-segment paint map. The four
      fixture-backed diy_type04 authoring identities expose palette, speed and
      family/variant structure, but no device rendering algorithm, so they are
      structural-only rather than deterministic. workshop_body and scene_type=2 expose
      palettes, layers and applied-area structure, but their selection, brightness and
      movement/timing semantics are not calibrated. scene_type=1 exposes ordered
      colours, palette and raw step values, but the meaning of those values and the
      rendering algorithm are not calibrated; every committed catalogue/fixture
      example is layout 0, while layout 1 has schema and synthetic-test support only,
      with no hardware evidence. scene_type=0 built-ins, uncaptured special DIY
      templates or other Type04 family/variant pairs absent from the committed
      authoring catalogue, built-in/reactive music modes, live video (DreamView), other
      DIY/workshop codes with no committed fixture, and unexercised H6199 families
      (e.g. diy_activation) must not be animated by a preview engine at all: for
      scene_type=0 and unfixtured codes this is an evidence gap (no shape is known,
      matching preview_level opaque); for music and video it is a principled
      live-signal limitation (matching preview_level live), not an evidence gap that
      more captures could close.
    status: open
    affects: [scenes_builtin, music_mode, video_dreamview, diy_upload, diy_activation]

capabilities:
