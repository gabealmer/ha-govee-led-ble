      - label: type04_fixture_catalogue
        preview_level: structural
        note: "The basic authoring roster and variation bytes are independently named by GoveeHome V7.5.30 dreamcolorlightv1.adjust.Diy and use diy_type04's captured family/variant structure. Four exact family/variant identities also have committed flat fixtures. Neither source maps those fields to device animation or per-position output."
