  - model: H617A
    capability: power
    summary: On/off via command_write sub 0x01; confirmed by both write and status readback.
    kaitai_schema: ["command_write.ksy::power_cmd", "status_reply.ksy::power_body"]
    evidence_status: confirmed
    evidence_refs: [command_write_power_on, command_write_power_off, status_reply_power]
    generated_module: custom_components/ha_govee_led_ble/generated_protocol/command_write.py
    runtime: {encode: wired, decode: wired, readback: wired}
    ha_surface: light.turn_on / light.turn_off
    persistence_need: device_readback
    preview_level: deterministic
    known_gaps: []

  - model: H617A
    capability: brightness
    summary: Brightness via command_write sub 0x04; write and query fixtures exist, no committed status-reply readback fixture exercises the brightness domain itself.
    kaitai_schema: ["command_write.ksy::brightness_cmd", "status_query.ksy::zero_body", "status_reply.ksy::brightness_body"]
    evidence_status: corroborated
    evidence_refs: [command_write_brightness, status_query_brightness]
    generated_module: custom_components/ha_govee_led_ble/generated_protocol/command_write.py
    runtime: {encode: wired, decode: wired, readback: wired}
    ha_surface: light.turn_on brightness_pct
    persistence_need: device_readback
    preview_level: deterministic
    known_gaps:
      - "No committed fixture exercises aa_domain::brightness / brightness_body in status_reply.ksy at all; only the write (command_write_brightness) and query (status_query_brightness) sides are fixture-confirmed. The reply-decode path runs in production and in mocked tests, but is never pinned by a spec/*.kst fixture."

  - model: H617A
    capability: static_color
    summary: RGB/kelvin static colour via command_write sub 0x15 (static_color fields rgb_direct, kelvin, rgb_preview, mask); confirmed via a colour-temp write and status readback fixtures.
    kaitai_schema: ["command_write.ksy::static_color", "status_reply.ksy::colormode_body", "status_reply.ksy::cm_static"]
    evidence_status: confirmed
    evidence_refs: [command_write_color_temp, status_reply_cm_static, status_reply_multi_effect]
    generated_module: custom_components/ha_govee_led_ble/generated_protocol/command_write.py
    runtime: {encode: wired, decode: wired, readback: wired}
    ha_surface: light.turn_on rgb_color / color_temp_kelvin
    persistence_need: restore_required
    preview_level: deterministic
    known_gaps:
      - "The only committed static write fixture (command_write_color_temp) exercises the kelvin branch (rgb_direct all-zero); a pure RGB write (kelvin=0, rgb_direct set) is not separately witnessed by a committed fixture, only inferred by field symmetry within the same static_body type."

  - model: H617A
    capability: segments
    summary: Per-segment brightness/colour via command_write sub 0x14 and the aa 0xa5 segment status-reply group; write side wired, status-reply decode exists only in the Kaitai/test corpus.
    kaitai_schema: ["command_write.ksy::static_brightness", "command_write.ksy::static_brightness_all", "status_reply.ksy::segments_body", "status_reply.ksy::segment"]
    evidence_status: confirmed
    evidence_refs:
      [command_write_seg_brightness, command_write_seg_brightness_all, status_reply_segments, status_reply_segments_last, status_reply_reject_segments_g06, status_reply_reject_segments_g07, status_reply_reject_segments_g0a]
    generated_module: custom_components/ha_govee_led_ble/generated_protocol/status_reply.py
    runtime: {encode: wired, decode: decode_only, readback: none}
    ha_surface: light.turn_on segment services (light_services.py)
    persistence_need: restore_required
    preview_level: structural
    known_gaps:
      - "Segment status-reply decode (segments_body / AaDomain::segments) is exercised only by kst_runner.py against the generated Kaitai class; no handwritten runtime module (protocol.py, coordinator.py) ever decodes a segment status reply, so segment state is optimistic-only via RestoreEntity, never verified against the device."

  - model: H617A
    capability: scenes_builtin
    summary: Built-in scene playback via command_write sub 0x04 scene_activate (code + scene_type) plus scene_body/scene_type1_body scene-definition catalogues; activation is fixture-evidenced only for scene_type=2 (workshop-authored scenes). The H617A catalogue holds 83 scenes (9 type0, 2 type1, 72 type2), 50 of which expose an ordinal speed option.
    kaitai_schema: ["command_write.ksy::scene_activate", "status_reply.ksy::colormode_body", "status_reply.ksy::cm_scene", "scene_body.ksy::scene_body", "scene_type1_body.ksy::scene_type1_body"]
    evidence_status: corroborated
    evidence_refs:
      [command_write_scene_workshop, status_reply_cm_scene, scene_body_aurora_fast, scene_body_brightness_gradient, scene_body_brightness_order_a, scene_body_brightness_order_b, scene_body_brightness_unified, scene_body_forest, scene_type1_catalogue_cards_game, scene_type1_catalogue_dance_party, scene_type1_catalogue_dusk, scene_type1_catalogue_sweet, scene_type1_h617a_halloween]
    generated_module: custom_components/ha_govee_led_ble/generated_protocol/command_write.py
    runtime: {encode: wired, decode: wired, readback: wired}
    ha_surface: light.turn_on effect
    persistence_need: device_readback
    preview_level: structural
    preview_variants:
      - label: scene_type0
        preview_level: opaque
        note: "9 catalogued scenes carry only a numeric scene_id — no scene_body/scene_type1_body-shaped schema or fixture at all — so nothing can be rendered; must not be animated or otherwise previewed."
      - label: scene_type1
        preview_level: structural
        note: "Both catalogued scenes and every committed scene_type1 fixture use layout 0. Ordered steps, palette, colours and raw values are previewable, but the values' meaning and rendering/timing/motion algorithm are uncalibrated. Layout 1 has schema and synthetic-test support only, with no hardware evidence."
      - label: scene_type2
        preview_level: structural
        note: "72 catalogued workshop-style layered scenes (50 with an ordinal speed option); movement interval/speed have only ever been observed to co-vary in the fixture corpus, never independently calibrated, so motion/timing stays structural even though layout/colour is concrete."
    known_gaps:
      - "The scene_activate write is only fixture-evidenced with scene_type=2 (command_write_scene_workshop); built-in scene_type values (0/1) are inferred from the enum and the read side (status_reply_cm_scene), not separately witnessed at the write side. Tracked by GitHub issue #125 (layout-1 type-1 scene body acceptance on real hardware)."
      - "See pipeline_known_issues: preview_fidelity_ceiling. Of the 83 catalogued scenes, the 9 scene_type=0 built-ins carry no scene_body/scene_type1_body-shaped schema or fixture at all, only a numeric scene_id is known, so they must not be animated (opaque). The 2 scene_type=1 scenes expose layout-0 ordered colours and raw values, but the values' meaning and rendering algorithm are uncalibrated; layout 1 has no hardware evidence. The 72 scene_type=2 workshop-style layered scenes remain structural-only because retention/speed/movement-interval semantics are unmeasured and movement interval/speed have only ever been observed to co-vary. See preview_variants for the per-scene_type breakdown."
      - "Current scene 'customisation' is a frozen replay of the captured scene definition's exact parameters, plus — for the 50 scenes exposing an ordinal speed option — a discrete speed-byte patch; there is no continuous/parametric control over colour, layout or timing."

